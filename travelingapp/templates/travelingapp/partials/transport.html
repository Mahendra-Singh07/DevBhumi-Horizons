{% load static %}
<section class="transport-section section" id="transport">
    <div class="container">
        <div class="section-heading">
            <span class="eyebrow">Getting Around</span>
            <h2>Comfortable Transport</h2>
            <p>Well-maintained vehicles and experienced mountain drivers for every group size.</p>
        </div>
        <div class="transport-container">
            <div class="transport-box">
                <img src="{% static 'travelingapp/image/mini-bus.webp' %}" alt="Mini Bus">
                <p>Mini Bus</p>
            </div>
            <div class="transport-box">
                <img src="{% static 'travelingapp/image/bolero.jpg' %}" alt="Bolero">
                <p>Bolero</p>
            </div>
            <div class="transport-box">
                <img src="{% static 'travelingapp/image/jeep.avif' %}" alt="Jeep">
                <p>Jeep</p>
            </div>
            <div class="transport-box">
                <img src="{% static 'travelingapp/image/swift.jpg' %}" alt="Swift Dzire">
                <p>Swift Dzire</p>
            </div>
        </div>
    </div>
</section>
