{% load static %}
<section class="hotel-section section section-alt" id="hotel">
    <div class="container">
        <div class="section-heading">
            <span class="eyebrow">Rest & Recharge</span>
            <h2>Hotel, Resorts &amp; SPA</h2>
            <p>Handpicked stays that pair Himalayan comfort with warm hospitality.</p>
        </div>
        <div class="hotel-container">
            <div class="hotel-circle">
                <img src="{% static 'travelingapp/image/nanital-hotal.webp' %}" alt="Natural Valley Resort Nainital">
                <p>Natural Valley Resort, Nainital</p>
            </div>
            <div class="hotel-circle">
                <img src="{% static 'travelingapp/image/gangotri-hotel.webp' %}" alt="Prakriti The Retreat Gangotri">
                <p>Prakriti The Retreat, Gangotri</p>
            </div>
            <div class="hotel-circle">
                <img src="{% static 'travelingapp/image/haridwar-hotel.webp' %}" alt="Hotel La Meridian Haridwar">
                <p>Hotel La Meridian, Haridwar</p>
            </div>
            <div class="hotel-circle">
                <img src="{% static 'travelingapp/image/massoorie-hotel.webp' %}" alt="The Kempty Castle Mussoorie">
                <p>The Kempty Castle, Mussoorie</p>
            </div>
        </div>
    </div>
</section>
