            <p>
                Curated treks, sacred pilgrimages and authentic local experiences across
                the Himalayas.
            </p>

        <form class="hero-search" method="get">
            <div class="hero-search-field">
                <span class="hero-search-icon"><i class="fa-solid fa-location-dot"></i></span>
                <div class="hero-search-input">
                    <label for="hs-destination">Where to?</label>
                    <input type="text" id="hs-destination" name="destination" placeholder="Search destination" autocomplete="off">
                    <!-- <select id="hs-destination" name="destination">
                        <option value="" selected disabled>Select Destination</option>

                        {% for package in packages %}

                        {% endfor %}
                    </select> -->
                    <small>e.g. Kedarnath, Valley of Flowers</small>
                </div>
                <div class="heroSearchSuggestion"></div>
            </div>

            <span class="hero-search-divider"></span>

            <div class="hero-search-field">
                <span class="hero-search-icon"><i class="fa-solid fa-calendar-days"></i></span>
                <div class="hero-search-input">
                    <label for="hs-date">Travel Date</label>
                    <input type="date" id="hs-date" name="travel_date" placeholder="Select date" />
                    <small>Select your departure date</small>
                </div>
                <i class="fa-solid fa-chevron-down hero-select-arrow"></i>
            </div>

            <span class="hero-search-divider"></span>

            <div class="hero-search-field">
                <span class="hero-search-icon"><i class="fa-solid fa-user-group"></i></span>
                <div class="hero-search-input">
                    <label for="hs-travelers">Travelers</label>
                    <input type="number" id="hs-travelers" name="total_travelers" min="1" max="15"
                        placeholder="Number of travelers" />
                    <small>Adults & children</small>
                </div>
                
                <i class="fa-solid fa-chevron-down hero-select-arrow"></i>
            </div>
